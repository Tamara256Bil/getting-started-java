plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.12.0'
}

repositories {
    mavenCentral()
}

configurations {
    aspectjAgent
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:5.10.2",
            "org.assertj:assertj-core:3.24.2")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    
    aspectjAgent "org.aspectj:aspectjweaver:1.9.25"
    testImplementation platform("io.qameta.allure:allure-bom:2.35.5")
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation "io.qameta.allure:allure-selenide"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    ignoreFailures = true
    
    doFirst {
        jvmArgs "-javaagent:${configurations.aspectjAgent.singleFile.absolutePath}"
    }
    
    systemProperty 'baseUrl', System.getProperty('baseUrl') ?: 'https://github.com'
    systemProperty 'browser', System.getProperty('browser') ?: 'chrome'
    systemProperty 'browserSize', System.getProperty('browserSize') ?: '1920x1080'
    systemProperty 'headless', System.getProperty('headless') ?: 'false'
    systemProperty 'selenide.headless', System.getProperty('headless', 'false')
    
    if (System.getProperty('headless') == 'true') {
        systemProperty 'chromeoptions.args', '--no-sandbox,--disable-dev-shm-usage'
    }
    
    reports {
        junitXml.destination = file('build/allure-results')
    }
}
