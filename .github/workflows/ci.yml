name: Java CI with Gradle

on:
  push:
    branches: [ "feature/homework-variant-a", "ci/diag-phase7", "main" ]
  pull_request:
    branches: [ "feature/homework-variant-a", "ci/diag-phase7", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable
        
    - name: Build and Test
      # Флаг -Dselenide.headless=true принудительно включает невидимый режим браузера
         - name: Build and Test
      run: ./gradlew test -Dselenide.headless=true -Dselenide.browser=chrome -Dchromeoptions.args="--no-sandbox,--disable-dev-shm-usage"
